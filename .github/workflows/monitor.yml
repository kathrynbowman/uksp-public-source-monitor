name: UKSP Public Source Monitoring
on:
  workflow_dispatch:
  schedule:
    - cron: '23 12 * * *'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: uksp-public-monitor
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out monitoring repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate monitor tests
        run: python -m unittest discover -s tests -v
      - name: Check 51 public source candidates
        env:
          UKSP_FEED_BASE: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: python watch.py
      - name: Save baselines and retrieval history
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add state public
          if ! git diff --cached --quiet; then
            git commit -m "Archive public source observations"
            git push
          fi
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload RSS feeds and evidence
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy public RSS feeds
        id: deployment
        uses: actions/deploy-pages@v4
